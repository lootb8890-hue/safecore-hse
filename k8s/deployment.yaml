apiVersion: apps/v1
kind: Deployment
metadata:
  name: safecore-backend-deployment
  namespace: safecore-production
  labels:
    app.kubernetes.io/name: safecore-hse
    app.kubernetes.io/component: api
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: safecore-hse
  template:
    metadata:
      labels:
        app.kubernetes.io/name: safecore-hse
    spec:
      containers:
        - name: nest-api
          image: safecore-container-registry.io/safecore-backend:v1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 4000
          envFrom:
            - configMapRef:
                name: safecore-config
            - secretRef:
                name: safecore-secrets
          resources:
            requests:
              memory: "512Mi"
              cpu: "500m"
            limits:
              memory: "2048Mi"
              cpu: "2000m"
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /api/v1/health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 5

---
apiVersion: v1
kind: Service
metadata:
  name: safecore-backend-service
  namespace: safecore-production
  labels:
    app.kubernetes.io/name: safecore-hse
spec:
  type: ClusterIP
  ports:
    - port: 4000
      targetPort: 4000
      protocol: TCP
      name: http
  selector:
    app.kubernetes.io/name: safecore-hse

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: safecore-multitenant-ingress
  namespace: safecore-production
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
    nginx.ingress.kubernetes.io/websocket-services: "safecore-backend-service"
    cert-manager.io/cluster-issuer: "letsencrypt-production"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - "*.safecore-hse.com"
        - "api.safecore-hse.com"
      secretName: safecore-wildcard-tls
  rules:
    - host: "*.safecore-hse.com"
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: safecore-backend-service
                port:
                  number: 4000
          - path: /hse
            pathType: Prefix # Socket.io WebSocket namespace
            backend:
              service:
                name: safecore-backend-service
                port:
                  number: 4000
