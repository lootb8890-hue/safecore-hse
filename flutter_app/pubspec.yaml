name: safecore_hse_platform
description: SafeCore HSE Enterprise White-Label Multi-Tenant Multi-Platform Ecosystem (Android, iOS, Web, Desktop)
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  
  # Responsive UI & White-Label Styling
  google_fonts: ^6.1.0
  flutter_animate: ^4.5.0
  intl: ^0.20.2
  lucide_icons: ^0.257.0
  
  # State Management & DI
  flutter_bloc: ^8.1.3
  provider: ^6.1.1
  get_it: ^7.6.6
  equatable: ^2.0.5
  
  # Networking, REST & Real-Time WebSockets
  dio: ^5.4.0
  web_socket_channel: ^2.4.1
  socket_io_client: ^2.0.3
  connectivity_plus: ^5.0.2
  
  # Offline-First Storage & Synchronization Database
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  shared_preferences: ^2.2.2
  path_provider: ^2.1.2
  
  # Interactive Engineering Layout Canvas & Mapping
  photo_view: ^0.14.0
  vector_math: ^2.1.4
  
  # QR/Barcode Scanner & Label Generator
  mobile_scanner: ^3.5.6
  qr_flutter: ^4.1.0
  barcode_widget: ^2.0.4
  
  # Audio Sirens, Media & Sensors (Zero-Latency Alerts)
  audioplayers: ^5.2.1
  geolocator: ^11.0.0
  image_picker: ^1.0.7
  file_picker: ^8.0.0
  signature: ^5.4.1
  
  # PDF & Data Reports Exporting
  pdf: ^3.10.7
  printing: ^5.11.1
  fl_chart: ^0.66.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  hive_generator: ^2.0.1
  build_runner: ^2.4.8

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/sounds/
    - assets/icons/
